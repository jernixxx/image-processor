<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Веб-приложение для обработки изображений: загрузка, каналы, уровни, масштабирование, фильтрация" />
  <title>Image Processor — Обработка изображений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/index-BeKPcINh.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DSpsQUVe.css">
</head>
<body>
  <div id="app">
    <!-- Верхняя панель инструментов -->
    <header id="toolbar" class="toolbar">
      <div class="toolbar__group toolbar__menu">
        <button id="btn-open" class="toolbar__btn" title="Открыть изображение">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          <span>Открыть</span>
        </button>
        <button id="btn-save" class="toolbar__btn" disabled title="Сохранить изображение">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Сохранить</span>
        </button>
        <div class="toolbar__separator"></div>
        <div id="save-format-group" class="toolbar__select-group" style="display:none;">
          <label for="save-format">Формат:</label>
          <select id="save-format" class="toolbar__select">
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
            <option value="gb7">GB7</option>
          </select>
        </div>
      </div>

      <div class="toolbar__group toolbar__tools">
        <div class="toolbar__separator"></div>
        <button id="btn-eyedropper" class="toolbar__btn toolbar__btn--tool" title="Пипетка (I)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 22l1-1h3l9-9"/><path d="M3 21l9-9"/><circle cx="17" cy="7" r="3"/><path d="M14.5 9.5L10 14"/></svg>
          <span>Пипетка</span>
        </button>
        <div class="toolbar__separator"></div>
        <button id="btn-levels" class="toolbar__btn" disabled title="Уровни (Ctrl+L)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/><path d="M8 15V9"/><path d="M12 15V5"/><path d="M16 15v-3"/></svg>
          <span>Уровни</span>
        </button>
        <button id="btn-resize" class="toolbar__btn" disabled title="Изменить размер">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
          <span>Размер</span>
        </button>
        <button id="btn-filter" class="toolbar__btn" disabled title="Фильтры (свёртка)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Фильтры</span>
        </button>
      </div>

      <div class="toolbar__group toolbar__zoom">
        <label for="zoom-select">Масштаб:</label>
        <select id="zoom-select" class="toolbar__select" disabled>
          <option value="12">12%</option>
          <option value="25">25%</option>
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100" selected>100%</option>
          <option value="150">150%</option>
          <option value="200">200%</option>
          <option value="300">300%</option>
          <option value="fit">По размеру</option>
        </select>
      </div>
    </header>

    <!-- Основное содержимое -->
    <main id="main-area" class="main-area">
      <!-- Левая боковая панель: инструменты (пипетка инфо) -->
      <aside id="left-panel" class="panel panel--left panel--collapsed">
        <div id="eyedropper-info" class="eyedropper-info panel__section" style="display:none;">
          <h3 class="panel__title">Пипетка</h3>
          <div class="eyedropper-info__color-preview" id="eyedropper-color-preview"></div>
          <table class="eyedropper-info__table">
            <tr><td>X:</td><td id="eyedropper-x">—</td></tr>
            <tr><td>Y:</td><td id="eyedropper-y">—</td></tr>
            <tr class="eyedropper-info__separator"><td colspan="2"><hr /></td></tr>
            <tr><td>R:</td><td id="eyedropper-r">—</td></tr>
            <tr><td>G:</td><td id="eyedropper-g">—</td></tr>
            <tr><td>B:</td><td id="eyedropper-b">—</td></tr>
            <tr><td>A:</td><td id="eyedropper-a">—</td></tr>
            <tr><td>HEX:</td><td id="eyedropper-hex">—</td></tr>
            <tr class="eyedropper-info__separator"><td colspan="2"><hr /></td></tr>
            <tr><td>L*:</td><td id="eyedropper-lab-l">—</td></tr>
            <tr><td>a*:</td><td id="eyedropper-lab-a">—</td></tr>
            <tr><td>b*:</td><td id="eyedropper-lab-b">—</td></tr>
          </table>
        </div>
      </aside>

      <!-- Центральная область с canvas -->
      <section id="canvas-area" class="canvas-area">
        <div id="canvas-container" class="canvas-container">
          <canvas id="main-canvas"></canvas>
          <div id="empty-state" class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <p>Перетащите изображение сюда<br />или нажмите «Открыть»</p>
            <p class="empty-state__formats">PNG, JPEG, GB7</p>
            <div class="empty-state__presets">
              <span class="empty-state__presets-title">Тестовые изображения GB7:</span>
              <div class="empty-state__presets-list">
                <button class="empty-state__preset-btn" data-preset="gradient-half-mask.gb7">Gradient + Mask</button>
                <button class="empty-state__preset-btn" data-preset="kapibara-mask.gb7">Kapibara + Mask</button>
                <button class="empty-state__preset-btn" data-preset="vertical-kapibara.gb7">Vertical Kapibara + Mask</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Правая боковая панель: каналы -->
      <aside id="right-panel" class="panel panel--right panel--collapsed">
        <div id="channels-panel" class="channels-panel panel__section" style="display:none;">
          <h3 class="panel__title">Каналы</h3>
          <div id="channels-list" class="channels-list">
            <!-- Динамически заполняется -->
          </div>
        </div>
      </aside>
    </main>

    <!-- Строка состояния -->
    <footer id="status-bar" class="status-bar">
      <span id="status-filename" class="status-bar__item">Нет файла</span>
      <span class="status-bar__separator">|</span>
      <span id="status-dimensions" class="status-bar__item">— × —</span>
      <span class="status-bar__separator">|</span>
      <span id="status-depth" class="status-bar__item">—</span>
      <span class="status-bar__separator">|</span>
      <span id="status-zoom" class="status-bar__item">100%</span>
      <span class="status-bar__flex"></span>
      <span id="status-cursor" class="status-bar__item"></span>
    </footer>

    <!-- Скрытый input для загрузки файлов -->
    <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.gb7" hidden />

    <!-- === ДИАЛОГИ === -->

    <!-- Диалог Уровней -->
    <dialog id="levels-dialog" class="dialog">
      <div class="dialog__header">
        <h2 class="dialog__title">Уровни</h2>
        <button class="dialog__close" data-close>&times;</button>
      </div>
      <div class="dialog__body">
        <div class="levels__channel-select">
          <label for="levels-channel">Канал:</label>
          <select id="levels-channel" class="toolbar__select">
            <option value="master">Master (RGB)</option>
            <option value="red">Красный</option>
            <option value="green">Зелёный</option>
            <option value="blue">Синий</option>
            <option value="alpha">Альфа</option>
          </select>
          <label class="levels__log-label">
            <input type="checkbox" id="levels-log" /> Лог. шкала
          </label>
        </div>
        <div class="levels__histogram-container">
          <canvas id="levels-histogram" width="256" height="128"></canvas>
        </div>
        <div class="levels__sliders">
          <label>Входные уровни:</label>
          <div class="levels__slider-row">
            <input type="number" id="levels-black" class="levels__input" value="0" min="0" max="254" />
            <input type="range" id="levels-black-slider" min="0" max="254" value="0" class="levels__range levels__range--black" />
            <input type="number" id="levels-gamma-val" class="levels__input levels__input--gamma" value="1.00" min="0.10" max="9.99" step="0.01" />
            <input type="range" id="levels-gamma-slider" min="10" max="990" value="100" class="levels__range levels__range--gamma" />
            <input type="number" id="levels-white" class="levels__input" value="255" min="1" max="255" />
            <input type="range" id="levels-white-slider" min="1" max="255" value="255" class="levels__range levels__range--white" />
          </div>
        </div>
        <div class="levels__preview-row">
          <label class="levels__preview-label">
            <input type="checkbox" id="levels-preview" checked /> Предпросмотр
          </label>
        </div>
      </div>
      <div class="dialog__footer">
        <button id="levels-reset" class="dialog__btn dialog__btn--secondary">Сброс</button>
        <button id="levels-cancel" class="dialog__btn dialog__btn--secondary">Отмена</button>
        <button id="levels-apply" class="dialog__btn dialog__btn--primary">Применить</button>
      </div>
    </dialog>

    <!-- Диалог изменения размера -->
    <dialog id="resize-dialog" class="dialog">
      <div class="dialog__header">
        <h2 class="dialog__title">Изменить размер</h2>
        <button class="dialog__close" data-close>&times;</button>
      </div>
      <div class="dialog__body">
        <div class="resize__info">
          <span>Текущий: <strong id="resize-current-mp">—</strong> Мпикс</span>
          <span>Новый: <strong id="resize-new-mp">—</strong> Мпикс</span>
        </div>
        <div class="resize__unit-select">
          <label for="resize-unit">Единицы:</label>
          <select id="resize-unit" class="toolbar__select">
            <option value="percent">Проценты (%)</option>
            <option value="pixels">Пиксели (px)</option>
          </select>
        </div>
        <div class="resize__dimensions">
          <div class="resize__field">
            <label for="resize-width">Ширина:</label>
            <input type="number" id="resize-width" class="resize__input" value="100" min="1" />
          </div>
          <button id="resize-link" class="resize__link-btn resize__link-btn--active" title="Сохранять пропорции">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          </button>
          <div class="resize__field">
            <label for="resize-height">Высота:</label>
            <input type="number" id="resize-height" class="resize__input" value="100" min="1" />
          </div>
        </div>
        <div class="resize__method-select">
          <label for="resize-method">Интерполяция:</label>
          <select id="resize-method" class="toolbar__select">
            <option value="bilinear">Билинейная</option>
            <option value="nearest">Ближайший сосед</option>
          </select>
          <div id="resize-method-tooltip" class="resize__tooltip"></div>
        </div>
      </div>
      <div class="dialog__footer">
        <button id="resize-cancel" class="dialog__btn dialog__btn--secondary">Отмена</button>
        <button id="resize-apply" class="dialog__btn dialog__btn--primary">Применить</button>
      </div>
    </dialog>

    <!-- Диалог фильтрации -->
    <dialog id="filter-dialog" class="dialog">
      <div class="dialog__header">
        <h2 class="dialog__title">Фильтры (свёртка)</h2>
        <button class="dialog__close" data-close>&times;</button>
      </div>
      <div class="dialog__body">
        <div class="filter__preset-select">
          <label for="filter-preset">Ядро:</label>
          <select id="filter-preset" class="toolbar__select">
            <option value="identity">Тождественное отображение</option>
            <option value="sharpen">Повышение резкости</option>
            <option value="gaussianBlur">Фильтр Гаусса (3×3)</option>
            <option value="boxBlur">Прямоугольное размытие</option>
            <option value="prewittX">Оператор Прюитта (X)</option>
            <option value="prewittY">Оператор Прюитта (Y)</option>
          </select>
        </div>
        <div class="filter__kernel-grid" id="filter-kernel-grid">
          <input type="number" class="filter__kernel-cell" data-idx="0" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="1" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="2" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="3" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="4" value="1" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="5" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="6" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="7" value="0" step="any"/>
          <input type="number" class="filter__kernel-cell" data-idx="8" value="0" step="any"/>
        </div>
        <div class="filter__channels">
          <span>Каналы:</span>
          <label><input type="checkbox" id="filter-ch-r" checked /> R</label>
          <label><input type="checkbox" id="filter-ch-g" checked /> G</label>
          <label><input type="checkbox" id="filter-ch-b" checked /> B</label>
          <label><input type="checkbox" id="filter-ch-a" /> A</label>
        </div>
        <div class="filter__edge-select">
          <label for="filter-edge">Заполнение края:</label>
          <select id="filter-edge" class="toolbar__select">
            <option value="copy">Копирование</option>
            <option value="black">Чёрный</option>
            <option value="white">Белый</option>
          </select>
        </div>
        <div class="filter__preview-row">
          <label>
            <input type="checkbox" id="filter-preview" checked /> Предпросмотр
          </label>
        </div>
      </div>
      <div class="dialog__footer">
        <button id="filter-close" class="dialog__btn dialog__btn--secondary">Закрыть</button>
        <button id="filter-reset" class="dialog__btn dialog__btn--secondary">Сброс</button>
        <button id="filter-apply" class="dialog__btn dialog__btn--primary">Применить</button>
      </div>
    </dialog>
  </div>

</body>
</html>
